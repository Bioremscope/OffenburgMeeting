<title>Where Prediction Stops</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  color-scheme: light;
  --paper:#F4F5F3; --card:#FFFFFF; --canvas:#FAFAF8;
  --ink:#16201E; --muted:#69756F; --line:#DCDED8;
  --accent:#0B6E63; --accent-soft:#E2EFEB;
  --stop:#963425; --stop-soft:#F7E5E1;
  --edge:#B9BFB9; --edge-dim:#D5D9D3;
  --body:"IBM Plex Sans", system-ui, -apple-system, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --paper:#0E1312; --card:#161C1A; --canvas:#111614;
    --ink:#E7EAE7; --muted:#95A09B; --line:#28302D;
    --accent:#5CBEAF; --accent-soft:#15302B;
    --stop:#E0866F; --stop-soft:#321E1A;
    --edge:#43504B; --edge-dim:#2C3532;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --paper:#0E1312; --card:#161C1A; --canvas:#111614;
  --ink:#E7EAE7; --muted:#95A09B; --line:#28302D;
  --accent:#5CBEAF; --accent-soft:#15302B;
  --stop:#E0866F; --stop-soft:#321E1A;
  --edge:#43504B; --edge-dim:#2C3532;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--body); font-size:15px; line-height:1.5;
  -webkit-text-size-adjust:100%;
  display:flex; flex-direction:column;
}

/* ── top bar ──────────────────────────────────────────── */
.bar{
  flex:none; border-bottom:1px solid var(--line); background:var(--card);
  padding:10px 16px; display:flex; align-items:center; gap:10px; min-height:58px;
}
.bar h1{font:600 18px/1.25 var(--body); margin:0; letter-spacing:-.01em; flex:1; min-width:0;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.bar .tag{font:500 14px/1 var(--mono); color:var(--muted); white-space:nowrap;
  font-variant-numeric:tabular-nums}
.btn{
  font:600 16px/1 var(--body); color:var(--accent); background:var(--accent-soft);
  border:0; border-radius:7px; padding:10px 12px; cursor:pointer; white-space:nowrap;
}
.btn:active{opacity:.7}
.btn:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.btn[aria-pressed="true"]{background:var(--accent); color:var(--card)}
.btn.ghost{background:none; padding:8px 2px}

/* ── legend ───────────────────────────────────────────── */
.legend{
  flex:none; display:flex; flex-wrap:wrap; gap:9px 16px; padding:11px 16px;
  border-bottom:1px solid var(--line); background:var(--card);
}
.legend span{display:inline-flex; align-items:center; gap:7px; font-size:15px;
  font-weight:500; color:var(--ink); white-space:nowrap}
.legend i{width:18px; height:18px; border-radius:50%; flex:none}

/* ── graph ────────────────────────────────────────────── */
.stage{flex:1; min-height:0; position:relative}
#cy{position:absolute; inset:0; background:var(--canvas);
  touch-action:none; overscroll-behavior:contain; -webkit-tap-highlight-color:transparent}
/* The structure is the thing a chemist actually reads, so it gets the empty
   space at the top of the canvas rather than a corner of the sheet. */
.structcard{
  position:absolute; top:10px; left:10px; z-index:5; cursor:pointer;
  background:color-mix(in srgb, var(--card) 93%, transparent);
  border:1px solid var(--line); border-radius:11px; padding:9px 11px 7px;
  max-width:min(80%, 330px); backdrop-filter:blur(6px);
  box-shadow:0 2px 12px rgba(0,0,0,.09);
}
.structcard .nm{font:600 15.5px/1.25 var(--body); margin-bottom:2px; display:block}
.structcard .fm{font:500 14.5px/1.3 var(--mono); color:var(--muted); display:block}
.structcard .fm sub{font-size:.72em}
.structcard svg.mol{width:100%; height:164px; display:block; margin-top:3px; color:var(--ink)}
.structcard .key{font:500 12.5px/1.3 var(--mono); color:var(--ink); display:block;
  margin-top:4px; letter-spacing:.02em; word-break:break-all}
.structcard .auth{font-size:12px; color:var(--muted); display:block; margin-top:1px}
.structcard .iso{font-size:12.5px; color:var(--accent); font-weight:500; display:block; margin-top:3px}
html,body{overscroll-behavior-y:contain}

/* ── hint + sheet ─────────────────────────────────────── */
.hint{
  flex:none; padding:11px 16px; font-size:15px; color:var(--ink);
  border-top:1px solid var(--line); background:var(--card);
}
.sheet{
  flex:none; background:var(--card); border-top:1px solid var(--line);
  padding:13px 16px calc(14px + env(safe-area-inset-bottom, 0px));
  max-height:38vh; overflow-y:auto;
}
.sheet-h{display:flex; align-items:flex-start; gap:11px; margin-bottom:8px}
.sheet-h .swatch{width:15px; height:15px; border-radius:50%; flex:none; margin-top:3px}
.sheet-h .who{flex:1; min-width:0}
.sheet-h h2{font:600 17px/1.25 var(--body); margin:0; letter-spacing:-.01em}
.sheet-h h2 em{font-style:italic}
.sheet-h .kind{font:600 12px/1 var(--body); letter-spacing:.07em; text-transform:uppercase;
  color:var(--muted); display:block; margin-bottom:4px}
.sheet p{margin:0 0 9px; font-size:15px; line-height:1.55}
.sheet p:last-child{margin-bottom:0}
.sheet .mono{font-family:var(--mono); font-size:13.5px; color:var(--muted)}
.sheet svg.mol{width:132px; height:100px; float:right; margin:0 0 6px 10px; color:var(--ink)}
.isostrip{display:flex; gap:7px; overflow-x:auto; padding:3px 0 6px; margin-top:4px}
.isostrip figure{margin:0; flex:none; width:98px; border:1px solid var(--line);
  border-radius:8px; padding:3px; background:var(--canvas)}
.isostrip figure.on{border-color:var(--accent); border-width:2px; padding:2px}
.isostrip svg.mol{width:100%; height:72px; float:none; margin:0; color:var(--ink)}
.isostrip figcaption{font:500 10px/1.1 var(--mono); color:var(--muted); text-align:center; padding-top:2px}
.isostrip figure.on figcaption{color:var(--accent)}
svg.mol path{stroke-width:2; stroke-linecap:butt; stroke-linejoin:miter; fill-rule:evenodd}
svg.mol ellipse{opacity:.2}
.badges{display:flex; flex-wrap:wrap; gap:5px; margin:8px 0}
.badge{font:500 12.5px/1 var(--body); padding:6px 9px; border-radius:5px; white-space:nowrap}
.badge.on{background:var(--accent-soft); color:var(--accent)}
.badge.off{background:var(--stop-soft); color:var(--stop)}
.wall{background:var(--stop-soft); color:var(--ink); border-radius:7px;
  padding:12px 13px; font-size:14.5px; line-height:1.5}
.wall b{color:var(--stop)}
.tapnote{font-size:14px; color:var(--accent); margin-top:9px; font-weight:500}
.loading{margin:auto; color:var(--muted); font-size:13.5px; padding:40px}
</style>

<div class="bar">
  <button class="btn ghost" id="back" hidden>&larr; All 16</button>
  <h1 id="title">Loading…</h1>
  <button class="btn" id="observed" aria-pressed="false" hidden>Lab degraders</button>
  <span class="tag" id="tag"></span>
</div>

<div class="legend" id="legend"></div>
<div class="stage"><div id="cy"></div><div class="structcard" id="structcard" hidden></div></div>
<div class="hint" id="hint">Tap a node to open it. Tap it again to close.</div>
<div class="sheet" id="sheet"><p class="loading">Loading the snapshot…</p></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.30.4/cytoscape.min.js" integrity="sha384-H3uzGzTfGHUAumB8+s4GEdfFwzAceN9wCCndN8AXubWKFIPuBSWKKtWDx7RhSf/z" crossorigin="anonymous"></script>
<script>
/* Colours and relative sizes are ported verbatim from the Neo4j Browser style
   the audience has just been shown on the laptop (demo/demo_kg/demo_style.grass),
   so the phone screen reads as the same graph zoomed in. They are node
   identities: they never change with the page theme. Only canvas, labels and
   edges follow it. */
const GRASS = {
  hub:      { color: '#D64545', size: 62 },
  pah:      { color: '#D64545', size: 46 },
  met_pred: { color: '#F2A9A0', size: 34 },
  met_kegg: { color: '#E8837A', size: 40 },
  enzyme:   { color: '#9575B8', size: 38 },
  genus:    { color: '#57A773', size: 36 },
  organism: { color: '#8FC99C', size: 34 },
  more:     { color: '#A5ABB6', size: 32 },
};
const LEGEND = [
  ['pah', 'PAH'], ['met_pred', 'Predicted'], ['met_kegg', 'In KEGG'],
  ['enzyme', 'Enzyme'], ['genus', 'Genome'], ['organism', 'Lab'],
];
const FIRST_GEN_CAP = 12;   // 20 products at 390px pushes labels below legibility
const CHILD_CAP = 6;
const ORGANISM_CAP = 12;
const Z_MIN = 0.72, Z_MAX = 1.9;

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const v = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const el = id => document.getElementById(id);

let INDEX = null, P = null, cy = null, ecIndex = new Map();
const cache = {};
const kids = new Map();     // node id -> [child ids], recorded when it blooms
const open = new Set();     // node ids whose children are on screen
const showAll = new Set();  // node ids whose capped fan has been expanded in full

async function load(path) {
  if (cache[path]) return cache[path];
  const r = await fetch('data/' + path);
  if (!r.ok) throw new Error(path);
  return (cache[path] = await r.json());
}

/* Ids are scoped to the parent that revealed the node. Two metabolites of
   benzo[a]pyrene reach the same partial EC, and two of fluorene do as well; with
   one global id per enzyme, collapsing the first metabolite would delete a node
   the second one still owns. Scoping keeps the picture a tree, which is what
   makes collapse a one-liner. The cost is that a genus can appear twice under
   two enzymes, which is the honest reading anyway: it carries both. */
const nid = (parent, kind, key) => kind + '|' + parent + '|' + key;

/* ── deterministic radial placement ───────────────────────────────────────
   No layout engine runs, ever. A physics pass jitters, and this demo gets
   given thirty times in an afternoon. Children sit on an arc centred on the
   direction their parent was itself placed in, so a branch grows outward and
   never back over its own trunk. Two nodes D radians apart on radius r are
   2r·sin(D/2) apart, so requiring that to clear SEP fixes the radius. */
const SEP = 86, R_MIN = 104, R_MAX = 200, RING_GAP = 54, JITTER = 18;

/* Deterministic stand-in for randomness. The distances want to look casual
   rather than machine-drawn, but they must be identical every time the same
   node is opened, or a collapse and re-open would visibly rearrange the graph
   while someone is looking at it. */
function jitter01(seed, i) {
  let h = 2166136261;
  const s = seed + '#' + i;
  for (let k = 0; k < s.length; k++) { h ^= s.charCodeAt(k); h = Math.imul(h, 16777619); }
  return ((h >>> 0) % 1000) / 1000;
}

/* A snail shell, ordered by fused-ring count: the two-ring compound sits nearest
   the centre and each turn outward is a heavier molecule. Distance from the
   centre becomes the axis the result runs along, which a ring of equal radii
   cannot show.

   The shell is squeezed to the canvas's own aspect ratio. Sixteen labelled nodes
   need roughly 680px across if they are spread on a circle, which is zoom 0.5 on
   a phone and unreadable; a portrait screen has height to spare, so the spiral
   is made tall and narrow and the same nodes render half again as large.

   Consecutive nodes are spaced by arc length rather than by angle, so the turns
   stay evenly spread instead of bunching up near the middle. */
function spiral(origin, n, opts) {
  opts = opts || {};
  const growth = opts.growth || 1.08;          // radius multiplier per node
  /* 22.5 degrees is 360/16 exactly: the sixteen beads make one full turn and
     every spoke from the hub gets its own bearing, 22.5 degrees clear of its
     neighbours. Any step that divides 360 by a whole number smaller than the
     bead count puts two beads on the same bearing and their two spokes merge
     into one line -- which is what 30 degrees did, at four pairs. */
  const turn = opts.turn || (22.5 * Math.PI / 180);
  const W = (cy && cy.width()) || 390, H = (cy && cy.height()) || 560;
  const squeeze = Math.max(0.5, Math.min(1, W / H));
  const out = [];
  let r = opts.minR || 170;
  let a = opts.axis !== undefined ? opts.axis : (-40 * Math.PI / 180);
  for (let i = 0; i < n; i++) {
    out.push({ x: origin.x + squeeze * r * Math.cos(a), y: origin.y + r * Math.sin(a), a });
    a += turn;
    r *= growth;
  }
  return out;
}

/* Captions radiate outward from the centre like the numbers on a dial. Hanging
   every caption below its bead is what made the shell unreadable: neighbours
   sit side by side, so their captions sit side by side too. Pushing each one
   along its own radius separates them for free. */
function labelSide(x, y) {
  const m = Math.hypot(x, y) || 1, ux = x / m, uy = y / m;
  if (Math.abs(ux) >= Math.abs(uy)) return { lh: ux > 0 ? 'right' : 'left' };
  return { lv: uy > 0 ? 'bottom' : 'top' };
}

function fan(origin, axis, n, opts) {
  opts = opts || {};
  const span = opts.span !== undefined ? opts.span : Math.PI * 1.15;
  const full = span >= Math.PI * 1.99;
  const seed = opts.seed || '';
  const jit = opts.jitter === undefined ? JITTER : opts.jitter;
  const at = (a, r, i) => {
    const rr = r + (jitter01(seed, i) - 0.5) * 2 * jit;
    return { x: origin.x + rr * Math.cos(a), y: origin.y + rr * Math.sin(a), a };
  };
  if (n <= 0) return [];
  if (n === 1) return [at(axis, opts.minR || R_MIN, 0)];
  const step = full ? span / n : span / (n - 1);
  const stagger = n > 6;
  // Two nodes D radians apart on radius r are 2·r·sin(D/2) apart. Staggering
  // puts alternate nodes on an outer ring, so same-ring neighbours are 2·step
  // apart and the ring can close in without the captions touching.
  const eff = Math.min(stagger ? 2 * step : step, Math.PI);
  const r0 = Math.min(Math.max((opts.sep || SEP) / (2 * Math.sin(eff / 2)),
                               opts.minR || R_MIN), opts.maxR || R_MAX);
  const start = full ? axis : axis - span / 2;
  const out = [];
  for (let i = 0; i < n; i++) {
    out.push(at(start + i * step, r0 + (stagger && (i % 2) ? RING_GAP : 0), i));
  }
  return out;
}

/* Framing keeps a legibility floor. cy.fit() on a growing tree zooms out until
   the labels are gone, which is the one thing this page cannot afford. */
function frame(eles, dur, floor) {
  if (!eles || !eles.length) return;
  const bb = eles.boundingBox({ includeLabels: true });
  if (!bb.w || !bb.h) return;
  const pad = 26, W = cy.width(), H = cy.height();
  const z = Math.min(Z_MAX, Math.max(floor || Z_MIN,
            Math.min((W - 2 * pad) / bb.w, (H - 2 * pad) / bb.h)));
  const cx = (bb.x1 + bb.x2) / 2, cyc = (bb.y1 + bb.y2) / 2;
  cy.animate({ zoom: z, pan: { x: W / 2 - z * cx, y: H / 2 - z * cyc } },
             { duration: dur === undefined ? 300 : dur, easing: 'ease-out-cubic' });
}

/* CSS variables are read at call time, not frozen into a literal at parse time:
   that is the bug in demo/app/app.js, where a theme change leaves a live graph
   styled for the old one. Everything here goes through classes and data()
   mappers, never element bypasses, so re-emitting the sheet restyles cleanly. */
function styleJson() {
  const ink = v('--ink'), canvas = v('--canvas'), edge = v('--edge'),
        dim = v('--edge-dim'), accent = v('--accent');
  return [
    { selector: 'node', style: {
        'background-color': 'data(color)', 'width': 'data(size)', 'height': 'data(size)',
        'label': 'data(label)', 'color': ink,
        'font-family': 'IBM Plex Sans, system-ui, sans-serif', 'font-size': 14,
        'font-weight': 500, 'text-valign': 'bottom', 'text-margin-y': 4,
        'text-wrap': 'wrap', 'text-max-width': 80, 'min-zoomed-font-size': 5,
        'text-outline-width': 3, 'text-outline-color': canvas,
        'text-events': 'yes',                      // the label is part of the tap target
        'border-width': 2, 'border-color': canvas, 'overlay-opacity': 0 } },
    { selector: 'node[kind="hub"]', style: { 'font-size': 16, 'font-weight': 600 } },
    { selector: 'node[kind="pah"]', style: { 'font-size': 15, 'font-weight': 600 } },
    { selector: 'node[mono=1]', style: { 'font-family': 'IBM Plex Mono, ui-monospace, monospace', 'font-size': 14 } },
    { selector: 'node[italic=1]', style: { 'font-style': 'italic' } },
    { selector: 'node[kind="more"]', style: { 'shape': 'round-rectangle', 'font-size': 12 } },
    { selector: 'node[wide=1]', style: { 'text-max-width': 80 } },
    { selector: 'node[lh="right"]', style: { 'text-halign': 'right', 'text-valign': 'center', 'text-margin-x': 8, 'text-margin-y': 0 } },
    { selector: 'node[lh="left"]', style: { 'text-halign': 'left', 'text-valign': 'center', 'text-margin-x': -8, 'text-margin-y': 0 } },
    { selector: 'node[lv="top"]', style: { 'text-valign': 'top', 'text-margin-y': -6 } },
    { selector: 'node[?expandable]', style: { 'border-color': edge } },
    { selector: 'node.focus', style: { 'border-width': 4, 'border-color': accent } },
    { selector: 'edge', style: {
        'width': 2, 'curve-style': 'straight', 'line-color': edge, 'opacity': 0.85 } },
    { selector: 'edge[weak=1]', style: { 'line-color': dim, 'line-style': 'dashed' } },
  ];
}

/* Bead size carries ring count. This is the one place the page departs from the
   Neo4j style, where every PAH is drawn the same size: fused-ring count is the
   axis the whole result runs along, so letting the picture show it is worth the
   small divergence. Colour, which is what makes the two screens read as one
   graph, is untouched. */
function ringSize(r) {
  const n = Math.min(Math.max(r || 2, 2), 6);
  return 26 + (n - 2) * 10.5;         // 2 rings -> 26px, 6 rings -> 68px
}

function def(id, kind, label, extra) {
  const key = kind === 'met' ? (extra && extra.in_kegg ? 'met_kegg' : 'met_pred') : kind;
  return { group: 'nodes', data: Object.assign(
    { id, kind, label, color: GRASS[key].color, size: GRASS[key].size }, extra || {}) };
}

/* ── what opening a node reveals ──────────────────────────────────────── */
/* C20H12O is not a formula a chemist reads, it is a string. Node captions are
   canvas text, so they get Unicode subscripts; the sheet gets real <sub>. */
const SUBS = { '0':'₀','1':'₁','2':'₂','3':'₃','4':'₄','5':'₅','6':'₆','7':'₇','8':'₈','9':'₉' };
const formulaSub = f => String(f || '').replace(/\d/g, d => SUBS[d]);
const formulaHtml = f => esc(String(f || '')).replace(/(\d+)/g, '<sub>$1</sub>');

/* The engine attacks every available ring position, so one parent can yield a
   dozen products sharing a formula — benzo[b]fluoranthene gives twelve C20H12O.
   Labelled by formula alone they read as twelve copies of the same thing, when
   they are twelve different places the oxygen went. Numbering them says how many
   there are; the structure card shows what differs. */
function isomers(s) {
  return P.steps.filter(k => k.generation === s.generation
                          && k.parent_id === s.parent_id
                          && k.formula === s.formula);
}

function metDef(parentId, s) {
  const childCount = P.steps.filter(k => k.parent_id === s.product_id).length;
  const sibs = isomers(s);
  const caption = s.in_kegg ? (s.kegg_name || s.product_id) : formulaSub(s.formula || '?');
  return def(nid(parentId, 'met', s.product_id), 'met', caption, {
    in_kegg: s.in_kegg ? 1 : 0, mono: s.in_kegg ? 0 : 1,
    iso_n: sibs.length,
    product_id: s.product_id, generation: s.generation, rule_name: s.rule_name,
    parent_pid: s.parent_id,
    formula: s.formula || '', svg: s.svg || '', kegg_name: s.kegg_name || '',
    skeleton: s.skeleton || '', name: s.name || '', name_source: s.name_source || '',
    knowability: s.knowability || '',
    lit: s.literature_reported ? 1 : 0, env: s.envipath_corroborated ? 1 : 0,
    reactions: (s.downstream || []).length,
    ecs: Array.from(new Set((s.downstream || []).reduce((a, r) => a.concat(r.ecs), []))).join(','),
    expandable: (childCount || (s.downstream || []).length) ? 1 : 0,
  });
}

function childrenOf(node) {
  const id = node.id(), kind = node.data('kind');

  if (kind === 'hub') {
    return { all: INDEX.pahs.map(p => def('pah|' + p.slug, 'pah', p.name, {
      slug: p.slug, rings: p.rings, size: ringSize(p.rings) })), cap: 99 };
  }
  if (kind === 'pah') {
    /* The first attack comes first, literally: the enzymes KEGG annotates on
       reactions that consume the compound itself. They are drawn before the
       products and are never subject to the product cap — for the six curated
       PAHs this is the enzyme a reader looks for on sight (nahAc), and for the
       other ten its absence is the compound not being in KEGG at all. */
    const enz = [];
    const seen = new Set();
    (P.first_attack || []).forEach(r => (r.ecs || []).forEach(ec => {
      if (seen.has(ec)) return;
      seen.add(ec);
      const m = ecIndex.get(ec);
      enz.push(def(nid(id, 'enz', ec), 'enzyme', (m && m.symbol) || ec.replace('ec:', 'EC '), {
        ec, first: 1,
        italic: m && m.symbol && !m.symbol.startsWith('EC ') ? 1 : 0,
        enzyme_name: (m && m.enzyme_name) || '', total: (m && m.total) || 0,
        expandable: (m && m.head.length) ? 1 : 0,
      }));
    }));
    const all = P.steps.filter(s => s.generation === 1);
    return { all: enz.concat(all.map(s => metDef(id, s))), cap: FIRST_GEN_CAP + enz.length };
  }
  if (kind === 'met') {
    const out = [];
    P.steps.filter(s => s.parent_id === node.data('product_id'))
           .forEach(s => out.push(metDef(id, s)));
    (node.data('ecs') || '').split(',').filter(Boolean).forEach(ec => {
      const m = ecIndex.get(ec);
      out.push(def(nid(id, 'enz', ec), 'enzyme', (m && m.symbol) || ec.replace('ec:', 'EC '), {
        ec, italic: m && m.symbol && !m.symbol.startsWith('EC ') ? 1 : 0,
        enzyme_name: (m && m.enzyme_name) || '', total: (m && m.total) || 0,
        expandable: (m && m.head.length) ? 1 : 0,
      }));
    });
    return { all: out, cap: CHILD_CAP + 4 };
  }
  if (kind === 'enzyme') {
    const m = ecIndex.get(node.data('ec'));
    if (!m) return { all: [], cap: 99 };
    return { all: m.head.map(g => def(nid(id, 'gen', g.genus), 'genus', g.genus, {
      italic: 1, genomes: g.genomes, ec: m.ec })), cap: 11 };
  }
  return { all: [], cap: 99 };
}

/* ── expand / collapse ────────────────────────────────────────────────── */
function descendants(id, acc) {
  acc = acc || [];
  (kids.get(id) || []).forEach(k => { acc.push(k); descendants(k, acc); });
  return acc;
}

function collapse(id) {
  const ids = descendants(id);
  if (ids.length) {
    cy.batch(() => {
      ids.forEach(i => { const e = cy.getElementById(i); if (e.length) cy.remove(e); });
    });
  }
  ids.forEach(i => { open.delete(i); kids.delete(i); showAll.delete(i); });
  kids.delete(id);
  open.delete(id);
}

function expand(node, opts) {
  opts = opts || {};
  const id = node.id();
  const got = childrenOf(node);
  let list = got.all;
  const hidden = showAll.has(id) ? 0 : Math.max(0, list.length - got.cap);
  if (hidden) list = list.slice(0, got.cap);
  if (!list.length && !hidden) return 0;

  const origin = node.position();
  const axis = node.data('axis') !== undefined ? node.data('axis')
             : (opts.axis !== undefined ? opts.axis : -Math.PI / 2);
  const defs = list.slice();
  if (hidden) {
    const unrecognised = got.all.slice(got.cap).filter(d => !d.data.in_kegg).length;
    defs.push(def(nid(id, 'more', 'x'), 'more',
      '+' + hidden + ' more' + (unrecognised === hidden ? '\n(0 in KEGG)' : ''),
      { expandable: 1, opens: id }));
  }
  const o = Object.assign({ seed: id }, opts);
  /* `shell: 'auto'` fits the shell to however many children this node has.
     One full turn (360/n per step) is what keeps every spoke on its own
     bearing: a step that divides 360 by fewer than n puts two children on the
     same line out of the parent. The radius grows by a fixed ratio, so the
     opening always reads as a spiral rather than a ring, and it starts far
     enough out that neighbouring captions clear each other. */
  if (o.shell === 'auto') {
    const n = defs.length;
    o.turn = 2 * Math.PI / Math.max(n, 2);
    o.growth = Math.pow(2.2, 1 / Math.max(n - 1, 1));
    o.minR = Math.max(120, 15 * n);
  }
  const pos = o.shell ? spiral(origin, defs.length, o)
                      : fan(origin, axis, defs.length, o);

  const add = [];
  defs.forEach((d, i) => {
    d.data.axis = pos[i].a;
    if (o.shell) {
      d.data.wide = 1;
      const side = labelSide(pos[i].x - origin.x, pos[i].y - origin.y);
      if (side.lh) d.data.lh = side.lh; else d.data.lv = side.lv;
    }
    add.push(Object.assign({}, d, { position: { x: pos[i].x, y: pos[i].y } }));
    add.push({ group: 'edges', data: {
      id: 'x' + id + '>' + d.data.id, source: id, target: d.data.id,
      weak: d.data.kind === 'more' ? 1 : 0 } });
  });
  cy.batch(() => { cy.add(add); });
  kids.set(id, defs.map(d => d.data.id));
  open.add(id);
  return defs.length;
}

/* One open branch per level. It bounds what is on screen, and it is also the
   right narrative: a visitor at a poster follows one chain, not a bush. */
function parentOf(id) {
  for (const [p, ks] of kids) if (ks.indexOf(id) >= 0) return p;
  return null;
}

function tapToToggle(n) {
  structCard(n.data('kind') === 'more' ? null : n);
  if (n.data('kind') === 'more') {
    const owner = n.data('opens');
    showAll.add(owner);
    const node = cy.getElementById(owner);
    collapse(owner);
    expand(node);
    cy.nodes().ungrabify();
    focusOn(node);
    return;
  }
  sheet(n);
  if (!n.data('expandable')) { focusOn(n); return; }
  const id = n.id();
  if (open.has(id)) { collapse(id); focusOn(cy.getElementById(parentOf(id) || id)); return; }
  const par = parentOf(id);
  (kids.get(par) || []).forEach(s => { if (s !== id && open.has(s)) collapse(s); });
  if (expand(n)) { cy.nodes().ungrabify(); focusOn(n); }
}

function focusOn(n) {
  cy.nodes().removeClass('focus');
  if (!n || !n.length) return;
  n.addClass('focus');
  frame(n.union(n.outgoers().union(n.incomers())), 300);
}

/* ── detail sheet and the status line ─────────────────────────────────── */
function status() {
  if (!P) {
    const t = INDEX.totals;
    el('hint').textContent =
      'Tap to open the 16 compounds · ' + t.transformations
      + ' transformations predicted · ' + t.in_kegg
      + ' products recognised by KEGG, all in ' + t.pahs_with_kegg + ' compounds';
    return;
  }
  const c = P.counts;
  el('hint').textContent =
    P.name + ' — ' + c.products + ' products predicted · ' + c.in_kegg
    + ' recognised by KEGG · ' + c.ecs + ' enzyme' + (c.ecs === 1 ? '' : 's')
    + ' reached · ' + c.experimental_genera + ' genera reported degrading it';
}

/* The structure card floats over the empty top of the canvas. A 2D drawing is
   what tells a researcher which position was attacked, and it was previously
   thumbnail-sized at the bottom of the sheet, where it could not do that job. */
function structCard(node) {
  const box = el('structcard');
  if (!node) { box.hidden = true; box.innerHTML = ''; return; }
  const d = node.data();
  let svg = '', name = '', formula = '', iso = '', key = '', auth = '';
  if (d.kind === 'pah') {
    svg = P.svg; name = P.name; formula = P.formula;
    key = P.skeleton || ''; auth = 'PubChem · KEGG';
  } else if (d.kind === 'met') {
    svg = d.svg;
    /* A product shown only as C10H8O cannot be checked by anyone. Name it with
       whatever authority knows the structure, and say which one that was — the
       gap between "the rules made this" and "somebody has named this" is part of
       what the abstract is measuring. */
    name = d.kegg_name || d.name || 'Unnamed structure';
    formula = d.formula;
    key = d.skeleton || '';
    auth = d.in_kegg ? 'KEGG compound'
         : d.name_source === 'literature' ? 'Named in the degradation literature'
         : d.name_source === 'pubchem' ? (d.knowability === 'chebi' ? 'PubChem · ChEBI' : 'PubChem only')
         : 'No public database registers this structure';
    if (d.iso_n > 1) iso = 'One of ' + d.iso_n + ' isomers sharing this formula';
  } else { box.hidden = true; box.innerHTML = ''; return; }
  if (!svg) { box.hidden = true; box.innerHTML = ''; return; }
  box.innerHTML = (name ? `<span class="nm">${esc(name)}</span>` : '')
    + (formula ? `<span class="fm">${formulaHtml(formula)}</span>` : '')
    + svg
    + (key ? `<span class="key">${esc(key)}</span>` : '')
    + (auth ? `<span class="auth">${esc(auth)}</span>` : '')
    + (iso ? `<span class="iso">${esc(iso)}</span>` : '');
  box.hidden = false;
}

function sheet(node) {
  const box = el('sheet');
  if (!node) { box.innerHTML = defaultSheet(); return; }
  const d = node.data();
  const key = d.kind === 'met' ? (d.in_kegg ? 'met_kegg' : 'met_pred') : d.kind;
  if (!GRASS[key]) { box.innerHTML = defaultSheet(); return; }
  const head = (title, sub) => `<div class="sheet-h">
      <span class="swatch" style="background:${GRASS[key].color}"></span>
      <span class="who"><span class="kind">${esc(sub)}</span><h2>${title}</h2></span>
    </div>`;
  let body = '';

  if (d.kind === 'pah') {
    const c = P.counts;
    body = head(esc(P.name), 'PAH · ' + P.rings + ' fused rings')
      + `<p class="mono">${formulaHtml(P.formula || '')}</p>
         <p>The engine proposed <b>${c.products}</b> transformation${c.products === 1 ? '' : 's'}
         from this structure. KEGG recognises <b>${c.in_kegg}</b> of the products.</p>`
      + `<p>The products nearest the compound are the ones the route carries on
           from; the ones furthest out are where it stops. Same direction as the
           shell you came in on.</p>`
      + (P.kegg_compound_id
        ? `<p>KEGG curates ${esc(P.name)} as a compound and annotates
             <b>${(P.first_attack || []).length}</b> reaction${(P.first_attack || []).length === 1 ? '' : 's'}
             that consume it. Those enzymes open with the products, purple, ahead of them.</p>`
        : `<div class="wall"><b>${esc(P.name)} is not a KEGG compound.</b> The pathway maps do not carry the molecule itself, so there is no annotated first attack to compare the prediction against — the gap opens before the first product, not after it.</div>`)
      + (c.in_kegg
        ? `<p class="tapnote">Tap the compound to open its first attack.</p>`
        : `<div class="wall"><b>Nothing to continue from.</b> No predicted product of ${esc(P.name)} matches a compound in the public PAH pathways, so no enzyme and no genome can be reached from its chemistry. Only the laboratory route remains.</div>`);
  } else if (d.kind === 'met') {
    const badges = [
      d.in_kegg ? '<span class="badge on">KEGG compound</span>' : '<span class="badge off">Not in KEGG</span>',
      d.lit ? '<span class="badge on">Seen in literature</span>' : '',
      d.env ? '<span class="badge on">enviPath agrees</span>' : '',
      d.name_source === 'literature' ? '<span class="badge on">Named in the literature</span>'
        : d.name_source === 'pubchem'
          ? `<span class="badge on">${d.knowability === 'chebi' ? 'PubChem · ChEBI' : 'PubChem only'}</span>`
          : (d.in_kegg ? '' : '<span class="badge off">Unnamed anywhere</span>'),
    ].filter(Boolean).join('');
    const sibs = d.iso_n > 1 ? isomers({ generation: d.generation, parent_id: d.parent_pid,
                                         formula: d.formula }) : [];
    const strip = sibs.length > 1 ? `
      <p>All ${sibs.length} share the formula ${formulaHtml(d.formula)}. They are the
         ${sibs.length} ring positions the engine could attack, and they differ only in
         where the oxygen went.</p>
      <div class="isostrip">${sibs.map((k, i) =>
        `<figure class="${k.product_id === d.product_id ? 'on' : ''}">${k.svg}</figure>`
        ).join('')}</div>` : '';
    body = head(esc(d.kegg_name || d.name || 'Unnamed structure'),
                'Predicted metabolite · generation ' + d.generation)
      + `<p class="mono">${formulaHtml(d.formula)}${d.skeleton ? ' · ' + esc(d.skeleton) : ''}</p>`
      + `<p class="mono">${esc(d.rule_name)}</p><div class="badges">${badges}</div>`
      + strip
      + (d.in_kegg
        ? `<p>Public annotation curates this structure, so the route carries on:
             ${d.reactions} reaction${d.reactions === 1 ? '' : 's'} consume it.</p>
           <p class="tapnote">Tap it to reveal the enzymes.</p>`
        : `<div class="wall"><b>The chain ends here.</b> This structure matches no compound in the curated PAH pathways. The prediction is chemically plausible and evidentially unsupported, so no enzyme and no organism follow from it.</div>`);
  } else if (d.kind === 'enzyme') {
    const rxns = d.first
      ? (P.first_attack || []).filter(r => (r.ecs || []).includes(d.ec)) : [];
    body = head(esc(d.label), d.first ? 'Enzyme · the first attack' : 'Enzyme')
      + `<p>${esc(d.enzyme_name)}</p><p class="mono">${esc(String(d.ec).replace('ec:', 'EC '))}</p>`
      + (rxns.length
        ? `<p>KEGG annotates this on the reaction that consumes ${esc(P.name)} itself.</p>`
          + rxns.map(r => `<p class="mono">${esc(r.reaction.replace('rn:', ''))} · ${esc(r.definition)}</p>`).join('')
        : '')
      + (d.total
        ? `<p>Carried by <b>${d.total}</b> sequenced genera in KEGG.</p>
           <p class="tapnote">Tap it to see them.</p>`
        : `<div class="wall"><b>Partial EC number.</b> KEGG classifies this reaction only to a sub-subclass, so no genome can be matched to it.</div>`);
  } else if (d.kind === 'genus') {
    body = head('<em>' + esc(d.label) + '</em>', 'Genus · genome evidence')
      + `<p><b>${d.genomes}</b> sequenced genome${d.genomes === 1 ? '' : 's'} of this genus carry the enzyme.</p>
         <p>That is genomic potential. It says the machinery is present, not that anyone measured this organism degrading ${esc(P.name)}.</p>`;
  } else if (d.kind === 'organism') {
    body = head('<em>' + esc(d.label) + '</em>', 'Genus · laboratory evidence')
      + `<p>Reported degrading ${esc(P.name)} in <b>${d.papers}</b> independent paper${d.papers === 1 ? '' : 's'}${d.runs ? ', across ' + d.runs + ' runs' : ''}.</p>
         <p>This route reads published outcomes. It names who, and says nothing about how.</p>`;
  } else {
    body = defaultSheet();
  }
  box.innerHTML = body;
  box.scrollTop = 0;
}

function defaultSheet() {
  if (!P) {
    return `<p>Sixteen polycyclic aromatic hydrocarbons are the priority pollutants this
      work is about. Tap the red circle to open them, then tap a compound and the rule
      engine breaks it down in front of you.</p>
      <p class="tapnote">Bead size is the number of fused rings: the small ones are two-ring
      compounds, the largest have six. That axis is where the result lives.</p>`;
  }
  return `<p>Tap any node to open it. Tap it again to close.</p>
    <p class="tapnote">Pale pink is a prediction nothing recognises; salmon means KEGG curates that compound; purple is the enzyme; green is an organism.</p>`;
}

/* ── graph construction ───────────────────────────────────────────────── */
function init(elements, onNodeTap, floor) {
  if (cy) { cy.destroy(); cy = null; }
  kids.clear(); open.clear(); showAll.clear();
  cy = window.cytoscape({
    container: el('cy'),
    elements,
    style: styleJson(),
    autoungrabify: true,
    autounselectify: true,
    boxSelectionEnabled: false,
    minZoom: 0.35,
    maxZoom: 4,
    touchTapThreshold: 10,
  });
  cy.on('tap', 'node', e => onNodeTap(e.target));
  cy.on('tap', e => { if (e.target === cy) { sheet(null); structCard(null); frame(cy.elements(), 300, floor); } });
}

function renderIndex() {
  P = null;
  structCard(null);
  el('back').hidden = true;
  el('observed').hidden = true;
  el('title').textContent = 'Where prediction stops';
  el('tag').textContent = INDEX.totals.pahs_with_kegg + '/' + INDEX.totals.pahs;

  // The page opens on the hub alone, centred, with nothing else to read. The
  // sixteen compounds are one tap away, which makes the first gesture the same
  // gesture the whole page runs on.
  const hub = Object.assign(def('hub', 'hub', '16 EPA PAHs', { expandable: 1 }),
                            { position: { x: 0, y: 0 } });
  init([hub], n => {
    if (n.data('kind') === 'pah') { location.hash = '#' + n.data('slug'); return; }
    if (n.data('kind') !== 'hub') return;
    if (open.has('hub')) { collapse('hub'); sheet(null); frame(cy.elements(), 300, 0.5); return; }
    expand(n, { shell: 1, minR: 170, growth: 1.08, turn: 22.5 * Math.PI / 180, axis: -40 * Math.PI / 180 });
    cy.nodes().ungrabify();
    // Open on the whole shell. The captions are small at this distance, but the
    // shape is the point of the first glance and pinching in reads any of them.
    frame(cy.elements(), 340, 0.40);
    el('hint').textContent = 'Distance from the centre follows ring count. Pinch to read a name, tap a compound to break it down.';
  }, 0.5);
  frame(cy.elements(), 0, 0.5);
  sheet(null);
  status();
}

async function renderPah(slug) {
  try { P = await load('pah/' + slug + '.json'); }
  catch { location.hash = ''; return; }
  ecIndex = new Map((P.ecs || []).map(e => [e.ec, e]));

  el('back').hidden = false;
  el('observed').hidden = false;
  el('observed').setAttribute('aria-pressed', 'false');
  el('title').textContent = P.name;
  el('tag').textContent = P.counts.in_kegg + '/' + P.counts.products;

  const rootId = 'pah|' + P.slug;
  const root = Object.assign(def(rootId, 'pah', P.name, { slug: P.slug, expandable: 1 }),
                             { position: { x: 0, y: 0 } });
  init([root], tapToToggle, 0.55);
  const node = cy.getElementById(rootId);
  // The opening view gets the same shell the sixteen compounds arrive on, so a
  // visitor who has seen one recognises the other. Deeper taps fall back to the
  // plain fan: from there the shape is whatever the visitor has opened.
  expand(node, { shell: 'auto', axis: -40 * Math.PI / 180 });
  cy.nodes().ungrabify();
  open.add(rootId);
  node.addClass('focus');
  frame(cy.elements(), 0, 0.42);
  sheet(node);
  structCard(node);
  status();
}

/* The laboratory route is a control and not a tap. It is separate evidence,
   gathered from sources that never saw KEGG, and it attaches to the compound
   rather than to anything downstream of it, so it gets the back arc the
   chemistry fan leaves free: chemistry grows upward, biology downward. */
function toggleObserved(btn) {
  if (!P) return;
  const rootId = 'pah|' + P.slug;
  if (btn.getAttribute('aria-pressed') === 'true') {
    cy.batch(() => {
      cy.nodes('[kind="organism"]').forEach(n => cy.remove(n));
    });
    btn.setAttribute('aria-pressed', 'false');
    return;
  }
  const all = P.experimental || [];
  if (!all.length) {
    el('sheet').innerHTML =
      `<div class="wall"><b>No laboratory route either.</b> No curated experiment in this snapshot reports a single organism degrading ${esc(P.name)}.</div>`;
    return;
  }
  const list = all.slice(0, ORGANISM_CAP);
  const root = cy.getElementById(rootId);
  const pos = fan(root.position(), Math.PI / 2, list.length,
                  { span: Math.PI * 1.1, minR: 150, maxR: 210, seed: 'lab' });
  const add = [];
  list.forEach((g, i) => {
    const id = nid(rootId, 'org', g.genus);
    add.push(Object.assign(def(id, 'organism', g.genus, { italic: 1, papers: g.papers, runs: g.runs }),
                           { position: { x: pos[i].x, y: pos[i].y } }));
    add.push({ group: 'edges', data: { id: 'x' + id, source: rootId, target: id, weak: 1 } });
  });
  cy.batch(() => { cy.add(add); });
  cy.nodes().ungrabify();
  btn.setAttribute('aria-pressed', 'true');
  el('sheet').innerHTML =
    `<div class="sheet-h"><span class="swatch" style="background:${GRASS.organism.color}"></span>
      <span class="who"><span class="kind">Laboratory route</span><h2>${all.length} genera reported</h2></span></div>
     <p>Curated primary literature reports ${all.length} genera degrading ${esc(P.name)}${all.length > list.length ? '; the ' + list.length + ' most reported are drawn' : ''}.</p>
     <p>${P.counts.in_kegg ? 'This evidence was gathered from sources that never saw KEGG. Where it agrees with the enzyme route above, it agrees independently.' : 'No mechanism reached this compound, so these genera are all the graph knows about it: who, without how.'}</p>`;
  frame(cy.elements(), 300, 0.5);
}

/* ── boot ─────────────────────────────────────────────────────────────── */
el('legend').innerHTML = LEGEND.map(([k, label]) =>
  `<span><i style="background:${GRASS[k].color}"></i>${esc(label)}</span>`).join('');
el('back').addEventListener('click', () => { location.hash = ''; });
el('structcard').addEventListener('click', () => structCard(null));
el('observed').addEventListener('click', e => toggleObserved(e.currentTarget));

function route() {
  const slug = location.hash.replace(/^#\/?/, '').trim();
  if (slug && INDEX.pahs.some(p => p.slug === slug)) renderPah(slug);
  else renderIndex();
}
window.addEventListener('hashchange', route);
window.addEventListener('orientationchange', () => {
  if (cy) { cy.resize(); frame(cy.elements(), 0, 0.5); }
});

const mq = window.matchMedia('(prefers-color-scheme: dark)');
const onTheme = () => requestAnimationFrame(() => { if (cy) cy.style().fromJson(styleJson()).update(); });
mq.addEventListener ? mq.addEventListener('change', onTheme) : mq.addListener(onTheme);

if (!window.cytoscape) {
  el('sheet').innerHTML =
    `<div class="wall">The graph library could not be loaded. This page needs a network connection the first time it opens.</div>`;
} else {
  load('index.json').then(d => { INDEX = d; route(); })
    .catch(() => { el('sheet').innerHTML = `<div class="wall">The snapshot could not be loaded.</div>`; });
}
</script>
